<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="#BF5200"/>
  <!-- Subtle inner warmth -->
  <rect width="32" height="32" rx="7" fill="url(#g)" opacity="0.3"/>
  <defs>
    <radialGradient id="g" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#F0A060"/>
      <stop offset="100%" stop-color="#BF5200" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Serif U -->
  <text
    x="16"
    y="23"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="700"
    font-style="italic"
    fill="#FAFAF7"
    text-anchor="middle"
    letter-spacing="-0.5"
  >U</text>
</svg>
